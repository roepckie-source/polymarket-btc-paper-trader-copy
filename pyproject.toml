[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "polymarket-btc-paper-trader"
version = "0.1.0"
description = "BTC 5-minute Polymarket paper trading research bot"
readme = "README.md"
requires-python = ">=3.14"
license = {text = "Research / Paper Trading"}
authors = [
    {name = "roepckie-source"}
]

dependencies = [
    "numpy>=2.2",
    "pandas>=2.2",
    "requests>=2.32",
    "python-dotenv>=1.0",
    "loguru>=0.7.0",
    "rich>=13.0.0",
    "redis>=5.0.0",
    "scikit-learn>=1.6",
    "xgboost>=3.0",
    "nautilus_trader>=1.200.0",
]

[project.optional-dependencies]
testing = [
    "pytest>=8.3",
]

monitoring = [
    "prometheus-client>=0.21",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = [
    "bot*",
    "core*",
    "data_sources*",
    "execution*",
    "feedback*",
    "infra*",
    "monitoring*",
    "patches*",
]