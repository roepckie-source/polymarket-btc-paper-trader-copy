name: Paper Trader Tests

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install project
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[testing]"

      - name: Run safety tests
        run: |
          pytest -q tests/test_main.py

      - name: Paper startup check
        env:
          POLYMARKET_PK: ""
          POLYMARKET_FUNDER: ""
          POLYMARKET_SIG_TYPE: "2"
          POLYMARKET_API_KEY: ""
          POLYMARKET_API_SECRET: ""
          POLYMARKET_PASSPHRASE: ""
          ETH_RPC_URL: ""
        run: |
          python main.py --test-mode --no-grafana --no-tui --skip-checks
